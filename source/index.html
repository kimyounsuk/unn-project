<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK쉴더스</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #333;
      background-color: #fff;
    }

    /* Top Banner */
    .top-banner {
      background-color: #0b0f19;
      color: #fff;
      text-align: center;
      padding: 10px 16px;
      font-size: 14px;
      position: relative;
    }
    .top-banner strong {
      color: #ff3b30;
    }
    .top-banner .close-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background-color: #fff;
      border-bottom: 1px solid #f0f0f0;
    }
    .logo {
      display: flex;
      align-items: center;
      font-weight: bold;
      font-size: 22px;
      color: #e4002b;
      text-decoration: none;
    }
    .logo span {
      color: #ea5404;
      margin-left: 2px;
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: 32px;
    }
    nav a {
      text-decoration: none;
      color: #222;
      font-weight: 500;
      font-size: 16px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-adt {
      background-color: #0033a0;
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
    .btn-caps {
      background-color: #0072ce;
      color: #fff;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }
    .header-icon {
      margin-left: 8px;
      cursor: pointer;
      font-size: 18px;
    }

    /* Hero Section */
    .hero {
      position: relative;
      height: calc(100vh - 110px);
      min-height: 500px;
      background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), 
                  url('https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1600') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 10%;
      color: #fff;
    }
    .hero h2 {
      font-size: 42px;
      font-weight: 400;
      margin-bottom: 8px;
    }
    .hero h1 {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    /* Floating Contact Box */
    .floating-contact {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #fff;
      border-radius: 30px;
      padding: 8px 8px 8px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      color: #222;
    }
    .phone-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }
    .phone-number {
      font-weight: 700;
      font-size: 18px;
    }
    .btn-consult {
      background-color: #ff0033;
      color: #fff;
      padding: 12px 24px;
      border-radius: 22px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- 상단 공지 배너 -->
  <div class="top-banner">
    ADT캡스 신규 고객을 위한 특별한 혜택! 최대 300만원 지원!
    <button class="close-btn">&times;</button>
  </div>

  <!-- 헤더 영역 -->
  <header>
    <a href="#" class="logo">
      SK<span>쉴더스</span>
    </a>
    <nav>
      <ul>
        <li><a href="#">사이버보안 인사이트</a></li>
        <li><a href="#">사이버보안 서비스</a></li>
        <li><a href="#">산업보안 서비스</a></li>
        <li><a href="#">고객지원</a></li>
        <li><a href="#">회사소개</a></li>
      </ul>
    </nav>
    <div class="header-right">
      <a href="#" class="btn-adt">ADT캡스</a>
      <a href="#" class="btn-caps">캡스홈</a>
      <span class="header-icon">🔍</span>
      <span class="header-icon">KR ∨</span>
    </div>
  </header>

  <!-- 메인 히어로 섹션 -->
  <section class="hero">
    <h2>안녕을 지키는 기술</h2>
    <h1>Total Security Innovator, SK쉴더스</h1>

    <!-- 하단 상담 신청 버튼 바 -->
    <div class="floating-contact">
      <div class="phone-info">
        <span>전화상담</span>
        <span class="phone-number">📞 1800-6400</span>
      </div>
      <a href="#" class="btn-consult">
        <span>📝</span> 사이버보안 전문상담
      </a>
    </div>
  </section>

</body>
</html>
